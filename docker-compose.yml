version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: craveclubs-backend
    ports:
      - "8000:9000"
    volumes:
      - ./backend:/var/www
      - ./backend/storage:/var/www/storage
    depends_on:
      - mysql
      - redis
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: craveclubs
      DB_USERNAME: craveclubs
      DB_PASSWORD: secret
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - craveclubs

  mysql:
    image: mysql:8.0
    container_name: craveclubs-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: craveclubs
      MYSQL_USER: craveclubs
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - craveclubs

  redis:
    image: redis:7-alpine
    container_name: craveclubs-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - craveclubs

volumes:
  mysql_data:
  redis_data:

networks:
  craveclubs:
    driver: bridge
